spring:
  application:
    name: GymSync

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gymsync_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

api:
  security:
    token:
      secret: ${JWT_SECRET:123456789}